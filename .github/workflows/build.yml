name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Contador.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Contador-apk
          path: Contador.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Contador.apk \
            --target "$GITHUB_SHA" \
            --title "Contador (última versión)" \
            --notes "APK generado automáticamente desde el commit ${GITHUB_SHA::7}. Descargá Contador.apk desde el celular e instalalo."
