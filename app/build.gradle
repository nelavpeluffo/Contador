plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nelavpeluffo.contador'
    compileSdk 35

    defaultConfig {
        applicationId "com.nelavpeluffo.contador"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "3.0"
    }

    // Clave fija para que cada APK nuevo se instale encima del anterior
    // sin tener que desinstalar. Es una app personal: la clave vive en el repo.
    signingConfigs {
        release {
            storeFile file('contador.keystore')
            storePassword 'contador'
            keyAlias 'contador'
            keyPassword 'contador'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
